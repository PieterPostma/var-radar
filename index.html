<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>VAR Radar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Condensed:wght@700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#F3F4F1;--surface:#FFFFFF;--line:#DADDD6;--text:#15181C;--muted:#5F6670;--accent:#1F7A8C;--crit:#C23B3B;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1214;--surface:#161A1D;--line:#2A3035;--text:#E7EAEC;--muted:#9AA3AB;--accent:#4FB8CC;--crit:#EF6464;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.5 "IBM Plex Sans",system-ui,"Segoe UI",sans-serif;display:grid;place-items:center;padding-inline:16px}
.box{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px 24px}
h1{font:700 26px/1.1 "IBM Plex Sans Condensed","Arial Narrow",sans-serif;margin:0 0 4px}
h1 b{color:var(--accent)}
p{margin:0 0 18px;color:var(--muted);font-size:13.5px}
label{display:block;font-size:12.5px;color:var(--muted);font-weight:500;margin-bottom:6px}
input[type=password]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font:500 15px "IBM Plex Mono",ui-monospace,monospace;color:var(--text)}
input[type=password]:focus{outline:none;border-color:var(--accent)}
.row{display:flex;align-items:center;gap:8px;margin:12px 0 18px;font-size:13px;color:var(--muted)}
button{width:100%;padding:10px;border:0;border-radius:8px;background:var(--accent);color:var(--surface);font:600 15px "IBM Plex Sans",system-ui,sans-serif;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{color:var(--crit);font-size:13px;min-height:20px;margin-top:10px}
.lang{display:flex;gap:4px;justify-content:flex-end;margin-bottom:10px}
.lang a{font:500 12px "IBM Plex Mono",monospace;color:var(--muted);text-decoration:none;padding:2px 6px;border-radius:4px}
.lang a.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="on">
  <div class="lang"><a href="?lang=nl" data-l="nl">NL</a><a href="?lang=en" data-l="en">EN</a></div>
  <h1><b>VAR</b> Radar</h1>
  <p id="intro"></p>
  <input type="text" name="username" value="var-radar" autocomplete="username" hidden>
  <label for="pw" id="lblPw"></label>
  <input id="pw" type="password" autocomplete="current-password" required autofocus>
  <div class="row"><input id="remember" type="checkbox" checked><label for="remember" id="lblRem" style="margin:0"></label></div>
  <button id="go" type="submit"></button>
  <div class="err" id="err" role="alert"></div>
</form>
<script>
(function () {
  var q = new URLSearchParams(location.search).get("lang"), lang;
  try { lang = q === "en" || q === "nl" ? q : localStorage.getItem("varLang") || ((navigator.language || "").toLowerCase().indexOf("nl") === 0 ? "nl" : "en"); } catch (e) { lang = "en"; }
  if (q) { try { localStorage.setItem("varLang", q); } catch (e) {} }
  var TX = {
    nl: { intro: "Dit dashboard is beveiligd. Voer het wachtwoord in om verder te gaan.", pw: "Wachtwoord", rem: "Onthoud op dit apparaat", go: "Openen", busy: "Ontsleutelen…", bad: "Onjuist wachtwoord.", net: "Kon de beveiligde data niet laden. Probeer het opnieuw." },
    en: { intro: "This dashboard is protected. Enter the password to continue.", pw: "Password", rem: "Remember on this device", go: "Open", busy: "Decrypting…", bad: "Incorrect password.", net: "Could not load the protected data. Please try again." }
  }[lang];
  document.documentElement.lang = lang;
  document.getElementById("intro").textContent = TX.intro;
  document.getElementById("lblPw").textContent = TX.pw;
  document.getElementById("lblRem").textContent = TX.rem;
  document.getElementById("go").textContent = TX.go;
  document.querySelectorAll(".lang a").forEach(function (a) { a.classList.toggle("on", a.dataset.l === lang); });

  var b64 = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  var toB64 = function (buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); };
  var KEY_ITEM = "varRadarKey";

  function fetchBlob(path) {
    return fetch(path + "?t=" + Date.now(), { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error("net"); return r.text(); });
  }
  function decryptWith(key, text) {
    var o = JSON.parse(text);
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(o.iv) }, key, b64(o.ct)).then(function (buf) { return new TextDecoder().decode(buf); });
  }
  function deriveKey(pw, blob) {
    var o = JSON.parse(blob);
    return crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]).then(function (base) {
      return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(o.salt), iterations: o.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
    });
  }
  function storedKey() {
    var raw = null;
    try { raw = sessionStorage.getItem(KEY_ITEM) || localStorage.getItem(KEY_ITEM); } catch (e) {}
    if (!raw) return Promise.resolve(null);
    return crypto.subtle.importKey("raw", b64(raw), { name: "AES-GCM" }, true, ["decrypt"]).catch(function () { return null; });
  }
  function forget() { try { sessionStorage.removeItem(KEY_ITEM); localStorage.removeItem(KEY_ITEM); } catch (e) {} }
  function launch(key, html) {
    window.__varDecrypt = function (text) { return decryptWith(key, text); };
    window.__varLock = function () { forget(); location.reload(); };
    document.open(); document.write(html); document.close();
  }

  var appBlob = fetchBlob("app.enc");
  // eerder ontgrendeld op dit apparaat? Dan direct openen.
  Promise.all([storedKey(), appBlob]).then(function (r) {
    if (!r[0]) return;
    return decryptWith(r[0], r[1]).then(function (html) { launch(r[0], html); }, forget);
  }).catch(function () {});

  document.getElementById("f").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var go = document.getElementById("go"), err = document.getElementById("err"), pw = document.getElementById("pw").value;
    go.disabled = true; go.textContent = TX.busy; err.textContent = "";
    appBlob.catch(function () { appBlob = fetchBlob("app.enc"); return appBlob; }).then(function (blob) {
      return deriveKey(pw, blob).then(function (key) {
        return decryptWith(key, blob).then(function (html) {
          return crypto.subtle.exportKey("raw", key).then(function (raw) {
            try {
              forget();
              (document.getElementById("remember").checked ? localStorage : sessionStorage).setItem(KEY_ITEM, toB64(raw));
            } catch (e) {}
            launch(key, html);
          });
        }, function () { throw new Error("bad"); });
      });
    }).catch(function (e) {
      err.textContent = e && e.message === "bad" ? TX.bad : TX.net;
      go.disabled = false; go.textContent = TX.go;
      document.getElementById("pw").select();
    });
  });
})();
</script>
</body>
</html>
